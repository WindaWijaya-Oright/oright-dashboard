<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach Reports</title>
<style>
:root{--ink:#1f2933;--muted:#66727f;--line:#d9dee3;--soft:#f4f6f8;--accent:#1d4e89;--ok:#2e7d4f;--pace:#2f6fb0;--warn:#b26a00;--warnbg:#fff3df;--okbg:#e6f4ea;--paceBg:#e8f1fb}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.bar select,.bar input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:110px}
.bar .sp{flex:1}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:940px;margin:18px auto;padding:0 12px 60px}
#msg{margin:0 0 12px;padding:10px 14px;border-radius:8px;display:none}
#msg.info{display:block;background:#e8f1fb;color:#134174}
#msg.err{display:block;background:#fdecea;color:#8a1c14}
#report{background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px 38px;display:none}
.brand{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#report h1{font-size:23px;margin:2px 0 2px}
#report h2{font-size:15px;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--accent);color:var(--accent)}
#report h3{font-size:13px;margin:14px 0 4px}
.meta{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.draft,.pill.behind{background:var(--warnbg);color:var(--warn)}
.pill.final,.pill.met{background:var(--okbg);color:var(--ok)}
.pill.on_track{background:var(--paceBg);color:var(--pace)}
.pill.na,.pill.stage{background:var(--soft);color:#44505c}
.headline{font-size:17px;font-weight:600;margin:14px 0 8px;line-height:1.4}
table{border-collapse:collapse;width:100%;margin:6px 0 4px;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
table.kpi td{width:25%;text-align:center;padding:10px 6px;background:var(--soft);border:1px solid #fff;border-width:0 3px}
.kpi .lab{font-size:11px;color:var(--muted)}
.kpi .big{font-size:26px;font-weight:700;line-height:1.2}
.kpi .sub{font-size:11px;color:var(--muted)}
table.card{margin:10px 0;border:1px solid #c9d2db}
table.card td.k{width:150px;color:var(--muted);background:var(--soft)}
table.card tr.head td{background:#eaf0f7;font-weight:600;border-bottom:1px solid #c9d2db}
.quote{font-style:italic}
.sugg{background:#f1f7ee}
ul,ol{margin:4px 0 4px 20px;padding:0}
li{margin:3px 0}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px 6px 2px 0;background:var(--soft)}
img.chart{display:block;max-width:100%;height:auto;margin:6px 0}
img.pb{display:block;height:14px;width:260px}
.hyp{border-left:3px solid #c9a227;padding-left:10px;margin:6px 0}
#internal{max-width:940px;margin:14px auto 0;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--muted);display:none}
#internal ul{margin-left:18px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print,.bar,#internal,#msg{display:none!important}
  main{margin:0;max-width:none;padding:0}
  #report{border:0;padding:0;border-radius:0}
  h2,h3,table.card,table.kpi,img.chart{break-inside:avoid}
  h2,h3{break-after:avoid}
}
</style>
</head>
<body>
<div class="bar no-print">
  <label>Report<select id="period"><option value="weekly">Weekly</option><option value="daily">Daily</option><option value="monthly">Monthly</option></select></label>
  <label>Which<select id="which"><option value="current">Current (to date)</option><option value="previous">Previous (complete)</option></select></label>
  <label>Or pick a date<input type="date" id="date"></label>
  <label>Person<input id="owner" list="owners" placeholder="All"><datalist id="owners"></datalist></label>
  <label>Report language<select id="lang"><option value="en">English</option><option value="zh">中文</option></select></label>
  <button id="go">Generate</button>
  <span class="sp"></span>
  <button id="copy" class="sec" disabled>Copy</button>
  <button id="pdf" class="sec" disabled>Save as PDF</button>
</div>
<main>
  <div id="msg"></div>
  <article id="report"></article>
  <details id="internal"><summary></summary><ul id="internalList"></ul></details>
</main>

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => (o && o[k] !== undefined) ? o[k] : m);
const pct = v => (v === null || v === undefined) ? '—' : v + '%';
const sign = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + Math.abs(x);
let T = L.en, lastReport = null;
const own = k => (T.ownerName && T.ownerName[k]) || k;

// ---------- images (canvas -> data URI so charts survive Copy-to-Word and PDF) ----------
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif';
function niceMax(v) { const m = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); for (const k of [1, 2, 2.5, 5, 10]) if (v <= k * m) return k * m; return 10 * m; }
function chartImg(o) {
  const dpr = 2, W = o.w || 800, H = o.h || 230, c = document.createElement('canvas');
  c.width = W * dpr; c.height = H * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const pL = 38, pR = 10, pT = 22, pB = 34, pw = W - pL - pR, ph = H - pT - pB, n = o.labels.length;
  const vals = o.bars.filter(v => v != null).concat((o.target || []).filter(v => v != null));
  const yMax = niceMax(Math.max(1, ...vals));
  g.font = '11px ' + FONT; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) { const y = pT + ph - ph * i / 4; g.strokeStyle = '#e6eaee'; g.lineWidth = 1; g.beginPath(); g.moveTo(pL, y); g.lineTo(W - pR, y); g.stroke(); g.fillStyle = '#7a8793'; g.textAlign = 'right'; g.fillText(String(+(yMax * i / 4).toFixed(1)), pL - 6, y); }
  const cw = pw / n, bw = Math.min(46, cw * 0.55);
  o.labels.forEach((lb, i) => {
    const cx = pL + cw * i + cw / 2, v = o.bars[i], t = o.target ? o.target[i] : null;
    if (v != null) { const h = ph * v / yMax; g.fillStyle = o.color || '#1d4e89'; g.fillRect(cx - bw / 2, pT + ph - h, bw, h); g.fillStyle = '#33414d'; g.textAlign = 'center'; g.textBaseline = 'bottom'; g.fillText(String(v), cx, pT + ph - h - 3); }
    else { g.strokeStyle = '#c9d2db'; g.setLineDash([3, 3]); g.strokeRect(cx - bw / 2, pT + ph - 2, bw, 2); g.setLineDash([]); }
    if (t != null && t > 0) { const y = pT + ph - ph * t / yMax; g.strokeStyle = '#e08a00'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - cw * 0.42, y); g.lineTo(cx + cw * 0.42, y); g.stroke(); }
    g.fillStyle = '#5a6773'; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(lb, cx, pT + ph + 8);
  });
  if (o.target) { g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#e08a00'; g.fillRect(pL, 7, 14, 3); g.fillStyle = '#5a6773'; g.fillText(o.targetName || '', pL + 20, 9); }
  return '<img class="chart" alt="" width="' + W + '" height="' + H + '" src="' + c.toDataURL('image/png') + '">';
}
const STATCOL = { met: '#2e7d4f', on_track: '#2f6fb0', behind: '#d9942b', 'n/a': '#9aa5b0' };
function progressImg(sent, target, pace, status) {
  const W = 260, H = 14, dpr = 2, c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#e6eaee'; g.fillRect(0, 0, W, H);
  if (target > 0) { g.fillStyle = STATCOL[status] || '#2f6fb0'; g.fillRect(0, 0, W * Math.min(1, sent / target), H); if (pace > 0 && pace < target) { g.fillStyle = '#1f2933'; g.fillRect(W * pace / target - 1, 0, 2, H); } }
  return '<img class="pb" alt="" width="' + W + '" height="' + H + '" src="' + c.toDataURL('image/png') + '">';
}
function hbarImg(v, max, color) {
  const W = 170, H = 12, dpr = 2, c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#e6eaee'; g.fillRect(0, 0, W, H); g.fillStyle = color || '#1d4e89'; g.fillRect(0, 0, max ? Math.max(v ? 2 : 0, W * v / max) : 0, H);
  return '<img alt="" width="' + W + '" height="' + H + '" src="' + c.toDataURL('image/png') + '">';
}

// ---------- building blocks ----------
function tbl(head, rows, numCols) {
  numCols = numCols || [];
  return '<table><thead><tr>' + head.map((h, i) => '<th class="' + (numCols.includes(i) ? 'n' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c, i) => '<td class="' + (numCols.includes(i) ? 'n' : '') + '">' + (c && c.__html ? c.__html : (c === null || c === undefined || c === '' ? '—' : esc(c))) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
const H = s => ({ __html: s });
const empty = () => '<p class="note">' + esc(T.none) + '</p>';
const pill = (cls, text) => '<span class="pill ' + cls + '">' + esc(text) + '</span>';
const stageLabel = s => T.stage[s] || s;
function kpiRow(cards) {
  return '<table class="kpi"><tr>' + cards.map(c => '<td><div class="lab">' + esc(c.lab) + '</div><div class="big">' + esc(c.big) + '</div><div class="sub">' + esc(c.sub || '') + '</div></td>').join('') + '</tr></table>';
}
function targetBlock(r) {
  const tg = r.targets, rows = [];
  const mk = (name, x) => [name, H(progressImg(x.sent, x.target, x.pace_to_date, x.status)), x.sent + ' / ' + x.target + ' (' + pct(x.pct_of_target) + ')', x.pace_to_date, H(pill(x.status === 'n/a' ? 'na' : x.status, T.stat[x.status]))];
  if (tg.people.length > 1) rows.push(mk(T.team, { ...tg.team, pace_to_date: tg.team.pace_to_date }));
  tg.people.forEach(p => rows.push(mk(p.owner, p)));
  let h = tbl(['', '', T.tSent + ' / ' + T.tTarget, T.tPace, T.tStatus], rows, [2, 3]);
  h += '<p class="note">' + esc(f(T.targetNote, { w: tg.weekly_per_person, d: tg.weekly_per_person / 5 })) + (r.period === 'daily' ? '' : ' ' + esc(f(T.paceNote, { t: tg.workdays_in_period, e: tg.workdays_elapsed, p: tg.pace_per_person }))) + '</p>';
  if ((tg.outside_team || []).length) h += '<p class="note">' + esc(f(T.outside, { x: tg.outside_team.map(o => o.owner + ' ' + o.sent).join(', ') })) + '</p>';
  return h;
}
function replyCards(r, n) {
  const list = r.new_replies || [];
  if (!list.length) return '<p class="note">' + esc(T.replyNone) + (r.auto_replies_in_period ? ' ' + esc(f(T.autoNote, { n: r.auto_replies_in_period })) : '') + '</p>';
  const acts = {}; ((n.reply_actions) || []).forEach(a => acts[a.reply] = a.suggested_action);
  let h = '<p class="note">' + esc(f(T.replyTotal, { n: r.new_replies_total })) + (r.new_replies_total > list.length ? ' ' + esc(f(T.more, { n: list.length })) : '') + (r.auto_replies_in_period ? ' ' + esc(f(T.autoNote, { n: r.auto_replies_in_period })) : '') + '</p>';
  list.forEach(x => {
    const nextTxt = x.next_step ? x.next_step + (x.next_step_due ? ' (' + T.r.due + ' ' + x.next_step_due + ')' : '') : T.r.none;
    const row = (k, v, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="k">' + esc(k) + '</td><td>' + v + '</td></tr>';
    h += '<table class="card"><tr class="head"><td colspan="2">' + esc(x.company) + ' · ' + esc([x.country, x.channel].filter(Boolean).join(' · ')) + '<span style="float:right" class="muted">' + esc(x.at) + '</span></td></tr>' +
      row(T.r.contact, esc((x.contact || '—') + (x.contact_email ? ' <' + x.contact_email + '>' : '')) + (x.type && x.type !== 'unclassified' ? ' ' + pill('stage', x.type) : '')) +
      row(T.r.said, '<span class="quote">“' + esc(x.snippet || '—') + '”</span>') +
      row(T.r.status, pill('stage', stageLabel(x.stage)) + (x.stage_since ? ' <span class="muted">' + esc(T.r.since === '起' ? x.stage_since + T.r.since : T.r.since + ' ' + x.stage_since) + '</span>' : '') + ' · ' + esc(T.r.owner) + ': ' + esc(own(x.owner))) +
      row(T.r.next, esc(nextTxt)) +
      (acts[x.id] ? row(T.r.sugg, esc(acts[x.id]), 'sugg') : '') +
      row(T.r.last, x.our_last_email ? esc('“' + x.our_last_email.subject + '” · ' + x.our_last_email.at + ' · ' + f(T.r.sent, { n: x.emails_we_sent })) : '—') +
      '</table>';
  });
  return h;
}
function funnelBlock(r) {
  const fn = r.funnel_to_date, max = Math.max(1, ...fn.map(x => x.n));
  let h = tbl([T.step.contacted + ' → ' + T.step.won, T.cnt, T.ofPrev, T.ofCont, ''], fn.map(x => [T.step[x.step], x.n, pct(x.pct_of_previous), pct(x.pct_of_contacted), H(hbarImg(x.n, max))]), [1, 2, 3]);
  const sr = (r.by_source_all_time || []).map(s => [T.srcName[s.key] || s.key, s.companies_contacted, s.replied, s.companies_contacted ? pct(Math.round(1000 * s.replied / s.companies_contacted) / 10) : '—', s.meetings]);
  if (sr.length) h += tbl([T.src, T.contacted, T.replied, T.rate, T.meetings], sr, [1, 2, 3, 4]);
  return h;
}
function replyRateBlock(r) {
  const rr = r.reply_rate, c1 = rr.this_period_cohort, c0 = rr.last_period_cohort;
  const cohort = c => c.companies_contacted ? f(T.rrOf, { a: c.companies_replied, b: c.companies_contacted }) + ' (' + pct(c.rate_pct) + ')' : f(T.rrNone, { n: 7, x: c.immature_companies_excluded });
  return tbl([T.metric, T.thisP, T.lastP], [[T.rrAll, f(T.rrOf, { a: rr.all_time.companies_replied, b: rr.all_time.companies_contacted }) + ' (' + pct(rr.all_time.rate_pct) + ')', ''], [f(T.rrMature, { n: 7 }), cohort(c1), cohort(c0)]]);
}
function pipelineChips(r) {
  const order = ['Won', 'Quotation', 'Sample', 'Meeting', 'Replied', 'Contacted', 'Nurture', 'Lost', 'Cold'], sc = r.pipeline_current.stage_counts || {};
  return '<div class="chips">' + order.filter(k => sc[k]).map(k => '<span>' + esc(stageLabel(k)) + ' <b>' + sc[k] + '</b></span>').join('') + '</div>';
}
const today0 = r => String(r.generated_at).slice(0, 10), D = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
function overdueTable(r, max) { const od = (r.followups || {}).overdue || []; return od.length ? tbl([T.company, T.stageCol, T.nextStep, T.due, T.daysOver], od.slice(0, max).map(x => [x.company, stageLabel(x.stage), x.next_step, x.due, Math.round((D(today0(r)) - D(x.due)) / 864e5)]), [4]) : empty(); }
function staleTable(r, max) { const st = r.stale_no_next_step || []; return st.length ? tbl([T.company, T.country, T.stageCol, T.daysIn], st.slice(0, max).map(x => [x.company, x.country, stageLabel(x.stage), x.days_in_stage]), [3]) : empty(); }
function dueTable(rows, max) { return rows.length ? tbl([T.company, T.stageCol, T.nextStep, T.due], rows.slice(0, max).map(x => [x.company, stageLabel(x.stage), x.next_step, x.due])) : empty(); }
function progressTable(r) { const pe = r.progress_events || []; return pe.length ? tbl([T.event, T.company, T.country, T.logged], pe.map(x => [T.kind[x.kind] || x.kind, x.company, x.country, x.at])) : empty(); }
function segTables(r) {
  const seg = rows => rows.map(x => [x.key, x.emails_sent, x.companies_contacted, x.replied, x.meetings]);
  let h = (r.by_brand_channel || []).length ? tbl([T.segBC, T.emails, T.companies, T.replied, T.meetings], seg(r.by_brand_channel), [1, 2, 3, 4]) : empty();
  if ((r.by_country_top5 || []).length) h += tbl([T.segC, T.emails, T.companies, T.replied, T.meetings], seg(r.by_country_top5), [1, 2, 3, 4]);
  return h;
}
function ownerTable(r) {
  const ow = r.by_owner || []; if (!ow.length) return empty();
  const note = ow.every(o => o.key === 'Unassigned') ? T.unassignedNote : T.ownerNote;
  return '<p class="note">' + esc(note) + '</p>' + tbl([T.person, T.emails, T.companies, T.replied, T.meetings, T.overdueCol], ow.map(o => [own(o.key), o.emails_sent, o.companies_contacted, o.replied, o.meetings, o.follow_ups_overdue]), [1, 2, 3, 4, 5]);
}
function analysisBlocks(n, opt) {
  opt = opt || {}; let h = '', any = false;
  if (opt.summary) {
    if ((n.highlights || []).length) h += '<h3>' + esc(T.hi) + '</h3><ul>' + n.highlights.map(x => '<li>' + esc(x.text) + '</li>').join('') + '</ul>';
    if ((n.concerns || []).length) h += '<h3>' + esc(T.co) + '</h3><ul>' + n.concerns.map(x => '<li>' + esc(x.text) + '</li>').join('') + '</ul>';
    return h;
  }
  if ((n.hypotheses || []).length) { any = true; h += '<h3>' + esc(T.hy) + '</h3>' + n.hypotheses.map(x => '<div class="hyp">' + esc(x.text) + '<div class="note">' + esc(T.verify) + ': ' + esc(x.how_to_verify) + '</div></div>').join(''); }
  if ((n.recommendations || []).length) { any = true; h += '<h3>' + esc(T.rec) + '</h3><ol>' + n.recommendations.map(x => '<li><b>' + esc(x.action) + '</b>' + (x.reason ? '<div class="note">' + esc(T.why) + ': ' + esc(x.reason) + '</div>' : '') + '</li>').join('') + '</ol>'; }
  if ((n.cannot_conclude || []).length) { any = true; h += '<h3>' + esc(T.cannot) + '</h3><ul>' + n.cannot_conclude.map(x => '<li>' + esc(x.text) + '</li>').join('') + '</ul>'; }
  if (!any) h += '<p class="note">' + esc(T.noAI) + '</p>';
  return h;
}
const sec = (title, body) => '<h2>' + esc(title) + '</h2>' + body;
const delta = (a, b) => f(T.k.vs, { p: b, d: sign(a - b) });

// ---------- three layouts ----------
function renderDaily(r, n) {
  const t = r.this_period, l = r.last_period, tg = r.targets.team, od = (r.followups || {}).overdue || [], dt = (r.followups || {}).due_today || [];
  let h = kpiRow([
    { lab: T.k.sentToday, big: t.emails_sent + ' / ' + tg.target, sub: tg.target ? f(T.k.pace, { p: tg.pace_to_date }) + ' · ' + T.stat[tg.status] : T.stat['n/a'] },
    { lab: T.k.repliesToday, big: t.companies_replied, sub: delta(t.companies_replied, l.companies_replied) },
    { lab: T.k.overdue, big: od.length, sub: '' }, { lab: T.k.dueToday, big: dt.length, sub: '' }]);
  h += sec(T.secChartDaily, chartImg({ labels: r.series.map(x => x.label), bars: r.series.map(x => x.sent), target: r.series.map(x => x.target), targetName: T.chartTarget, w: 800, h: 210 }));
  h += sec(T.secRepliesToday, replyCards(r, n));
  h += sec(T.secTodo, '<h3>' + esc(T.dueTodayH) + '</h3>' + dueTable(dt, 10) + '<h3>' + esc(T.overdue) + ' (' + od.length + ')</h3>' + overdueTable(r, 8));
  h += sec(T.secAnalysis, analysisBlocks(n, { summary: true }) + analysisBlocks(n));
  return h;
}
function renderWeekly(r, n) {
  const t = r.this_period, l = r.last_period;
  let h = analysisBlocks(n, { summary: true });
  h += sec(T.secTarget, targetBlock(r));
  h += kpiRow([{ lab: T.k.sent, big: t.emails_sent, sub: delta(t.emails_sent, l.emails_sent) }, { lab: T.k.contacted, big: t.companies_contacted, sub: delta(t.companies_contacted, l.companies_contacted) },
    { lab: T.k.replies, big: t.companies_replied, sub: delta(t.companies_replied, l.companies_replied) }, { lab: T.k.meetings, big: t.meetings_logged, sub: delta(t.meetings_logged, l.meetings_logged) }]);
  h += sec(T.secChartWeek, chartImg({ labels: r.series.map(x => x.label), bars: r.series.map(x => x.sent), target: r.series.map(x => x.target), targetName: T.chartTarget }));
  h += sec(T.secRepliesWeek, replyCards(r, n));
  h += sec(T.secProgress, progressTable(r));
  h += sec(T.secFunnel, funnelBlock(r) + '<h3>' + esc(T.secReply) + '</h3>' + replyRateBlock(r));
  h += sec(T.secPipeline, pipelineChips(r));
  h += sec(T.secAction, '<h3>' + esc(T.overdue) + '</h3>' + overdueTable(r, 6) + '<h3>' + esc(T.noNext) + ' (' + (r.stale_no_next_step || []).length + ')</h3>' + staleTable(r, 6));
  const nx = (r.followups || {}).next_7_days || [], um = r.upcoming_meetings_14d || [];
  h += sec(T.secNext, '<h3>' + esc(T.next7) + '</h3>' + dueTable(nx, 10) + (um.length ? '<h3>' + esc(T.upcoming) + '</h3>' + tbl([T.company, T.due], um.map(x => [x.company, x.at])) : '') +
    (r.leads_ready_to_contact != null ? '<h3>' + esc(T.ready) + '</h3><p><b>' + r.leads_ready_to_contact + '</b> <span class="muted">(' + esc(T.readyDesc) + ')</span></p>' : ''));
  h += sec(T.secAnalysis, analysisBlocks(n));
  return h;
}
function renderMonthly(r, n) {
  const t = r.this_period, l = r.last_period;
  let h = analysisBlocks(n, { summary: true });
  h += sec(T.secTarget, targetBlock(r));
  h += kpiRow([{ lab: T.k.sent, big: t.emails_sent, sub: delta(t.emails_sent, l.emails_sent) }, { lab: T.k.contacted, big: t.companies_contacted, sub: delta(t.companies_contacted, l.companies_contacted) },
    { lab: T.k.replies, big: t.companies_replied, sub: delta(t.companies_replied, l.companies_replied) }, { lab: T.k.meetings, big: t.meetings_logged, sub: delta(t.meetings_logged, l.meetings_logged) }]);
  h += sec(T.secChartMonth, chartImg({ labels: r.series.map(x => x.label), bars: r.series.map(x => x.sent), target: r.series.map(x => x.target), targetName: T.chartTarget, h: 240 }));
  h += '<h3>' + esc(T.secChartReplies) + '</h3>' + chartImg({ labels: r.series.map(x => x.label), bars: r.series.map(x => x.replied), color: '#2e7d4f', h: 190 });
  h += sec(T.secFunnel, funnelBlock(r) + '<h3>' + esc(T.secReply) + '</h3>' + replyRateBlock(r));

  h += sec(T.secProgress, progressTable(r) + '<h3>' + esc(T.secPipeline) + '</h3>' + pipelineChips(r));
  h += sec(T.secAction, '<h3>' + esc(T.noNext) + ' (' + (r.stale_no_next_step || []).length + ')</h3>' + staleTable(r, 6) + '<h3>' + esc(T.overdue) + '</h3>' + overdueTable(r, 6));
  h += sec(T.secPlanMonth, analysisBlocks(n));

}

function render(r) {
  const n = r.narrative || {}, w = r.window;
  let h = '<div class="brand">' + esc(T.brand) + '</div><h1>' + esc(T.title[r.period]) + ' ' + pill(r.status === 'Final' ? 'final' : 'draft', r.status === 'Final' ? T.final : T.draft) + '</h1>';
  h += '<div class="meta">' + esc(T.tagline[r.period]) + '</div>';
  h += '<div class="meta">' + esc(T.range) + ': ' + esc(w.start) + (w.end !== w.start ? ' ~ ' + esc(w.end) : '') + ' · ' + esc(T.scope) + ': ' + esc(r.owner_filter || T.all) + ' · ' + esc(T.generated) + ': ' + esc(r.generated_at) + '</div>';
  h += '<div class="note">' + esc(w.partial_period ? f(T.draftNote, { d: w.effective_end }) : T.finalNote) + '</div>';
  h += '<div class="headline">' + esc(n.headline || T.noAI) + '</div>';
  h += r.period === 'daily' ? renderDaily(r, n) : r.period === 'monthly' ? renderMonthly(r, n) : renderWeekly(r, n);
  h += '<p class="note" style="margin-top:22px">' + esc(T.foot) + '</p>';
  $('report').innerHTML = h; $('report').style.display = 'block';
  const checks = (r.data_checks || []).slice();
  if (n.meta && n.meta.ai_status && n.meta.ai_status !== 'ok') checks.push('AI: ' + n.meta.ai_status);
  ((n.meta && n.meta.dropped) || []).forEach(x => checks.push('Guard: ' + x));
  $('internal').style.display = checks.length ? 'block' : 'none';
  $('internal').querySelector('summary').textContent = T.internal + ' (' + checks.length + ')';
  $('internalList').innerHTML = checks.map(x => '<li>' + esc(x) + '</li>').join('');
  $('owners').innerHTML = (r.by_owner || []).filter(o => o.key !== 'Unassigned' && o.key !== 'Imported (manual)').map(o => '<option value="' + esc(o.key) + '">').join('');
}

function say(kind, text) { const m = $('msg'); m.className = kind || ''; m.textContent = text || ''; if (!kind) m.style.display = 'none'; }
function targetDate() {
  if ($('date').value) return $('date').value;
  if ($('which').value !== 'previous') return '';
  const d = new Date(Date.now() + 8 * 3600e3), p = $('period').value, y = d.getUTCFullYear(), m = d.getUTCMonth(), dd = d.getUTCDate();
  const out = p === 'daily' ? new Date(Date.UTC(y, m, dd - 1)) : p === 'weekly' ? new Date(Date.UTC(y, m, dd - 7)) : new Date(Date.UTC(y, m, 0));
  return out.toISOString().slice(0, 10);
}
async function generate() {
  T = L[$('lang').value] || L.en;
  const body = { period: $('period').value, lang: $('lang').value }, dt = targetDate();
  if (dt) body.date = dt;
  if ($('owner').value.trim()) body.owner = $('owner').value.trim();
  $('go').disabled = true; say('info', UI.loading);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 150000);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body), signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let d = await res.json(); if (Array.isArray(d)) d = d[0];
    if (!d || d.ok === false || !d.window) throw new Error((d && d.error) || 'Empty response');
    lastReport = d; render(d); say('');
    $('copy').disabled = false; $('pdf').disabled = false;
    try { localStorage.setItem('rp_prefs', JSON.stringify({ lang: $('lang').value, period: $('period').value })); } catch (e) {}
  } catch (e) { say('err', UI.fail + ': ' + (e.name === 'AbortError' ? 'timeout' : e.message) + '. ' + UI.failHint); }
  finally { clearTimeout(to); $('go').disabled = false; }
}
function copyReport() {
  const el = $('report'), sel = getSelection(), rg = document.createRange();
  rg.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(rg);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
  say(ok ? 'info' : 'err', ok ? UI.copied : 'Copy failed: select the report manually and press Ctrl/Cmd+C.');
  if (ok) setTimeout(() => say(''), 2500);
}
function savePdf() {
  const old = document.title, w = lastReport && lastReport.window;
  if (w) document.title = 'Oright_' + lastReport.period + '_report_' + w.start + (lastReport.owner_filter ? '_' + lastReport.owner_filter : '');
  say('info', UI.pdfHint);
  setTimeout(() => { window.print(); document.title = old; setTimeout(() => say(''), 1500); }, 150);
}
try { const p = JSON.parse(localStorage.getItem('rp_prefs') || '{}'); if (p.lang && L[p.lang]) $('lang').value = p.lang; if (p.period) $('period').value = p.period; } catch (e) {}
$('go').addEventListener('click', generate); $('copy').addEventListener('click', copyReport); $('pdf').addEventListener('click', savePdf);
